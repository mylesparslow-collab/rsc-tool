[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsc-tool"
version = "0.2.5"
description = "Reclaimed Space Crafters: jobs, phased billing, expenses, and a local-model email assistant"
requires-python = ">=3.11"
dependencies = ["flask>=3.0", "openpyxl>=3.1", "pypdf>=4.0", "reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
voice = ["faster-whisper>=1.0"]
desktop = ["pywebview>=5.3"]

[project.scripts]
rsc = "rsc.cli:main"

[tool.setuptools]
packages = ["rsc"]

[tool.setuptools.package-data]
rsc = ["templates/*.html", "static/*.css", "static/*.js", "static/vendor/*.js", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
